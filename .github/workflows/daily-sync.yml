name: Daily Weather & Availability Sync

on:
  schedule:
    # Run daily at 6:00 AM UTC (avoids GitHub Actions peak hours)
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Also run on push to master to ensure pipeline stays active
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/daily-sync.yml'

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync weather and availability (all regions)
        run: python -m src.flows.pipeline --weather-availability
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECREATION_GOV_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          NOAA_USER_AGENT: ${{ secrets.NOAA_USER_AGENT }}
          PREFECT_API_URL: ""
