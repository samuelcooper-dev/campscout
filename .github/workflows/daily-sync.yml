name: Daily Weather & Availability Sync

on:
  schedule:
    # Run daily at 6:00 AM UTC (avoids GitHub Actions peak hours)
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Also run on push to master to ensure pipeline stays active
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/daily-sync.yml'

jobs:
  # Run each region in parallel using matrix strategy
  sync-region:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Reduced from 90 since each region runs separately

    strategy:
      matrix:
        region: [southeast, northeast, great_lakes, plains, mountain, pacific_west]
      fail-fast: false  # Continue other regions even if one fails
      max-parallel: 6   # Run all 6 regions simultaneously

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync ${{ matrix.region }} weather and availability
        run: python -m src.flows.pipeline --weather-availability --region ${{ matrix.region }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECREATION_GOV_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          NOAA_USER_AGENT: ${{ secrets.NOAA_USER_AGENT }}
          PREFECT_API_URL: ""

  # Refresh materialized view after all regions complete
  finalize:
    runs-on: ubuntu-latest
    needs: sync-region
    timeout-minutes: 5
    if: always()  # Run even if some regions failed

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh materialized view
        run: python -c "from src.storage.database import SessionLocal; import sqlalchemy; db = SessionLocal(); db.execute(sqlalchemy.text('REFRESH MATERIALIZED VIEW CONCURRENTLY campground_summary_mv')); db.commit(); print('✓ Materialized view refreshed')"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
